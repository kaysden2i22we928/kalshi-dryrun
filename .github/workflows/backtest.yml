name: Backtest last 7 days

on:
  workflow_dispatch: {}
  push:
    paths: ["backtest.py", "config.json"]

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay last week with your rules
        run: python backtest.py --days 7
      - name: Save results
        run: |
          git config user.name "dryrun-bot"
          git config user.email "dryrun-bot@users.noreply.github.com"
          git add docs/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "Backtest $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
