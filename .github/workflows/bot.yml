name: Dry-run bot

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may start runs a few minutes late; each run watches for 9 minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dryrun-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Watch markets (dry run, no real orders)
        run: python bot.py --minutes 9 --every 15
      - name: Save results
        run: |
          git config user.name "dryrun-bot"
          git config user.email "dryrun-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Dry-run results $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
